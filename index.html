<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Website Under Maintenance</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* Inter font from Google Fonts */
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap');

        body {
            font-family: 'Inter', sans-serif;
            overflow: hidden; /* Hide scrollbars due to background animation */
        }

        /* Softer, Eye-Friendly Gradient Background with #3c83f6 */
        .modern-gradient-bg {
            /* A calming gradient from a light blue to the requested #3c83f6 */
            background: linear-gradient(135deg, #A8DDEE 0%, #3c83f6 100%);
        }

        /* Floating Animation for background elements */
        @keyframes float {
            0% { transform: translateY(0px) rotate(0deg); opacity: 0.6; }
            25% { transform: translateY(-12px) rotate(6deg); opacity: 0.7; }
            50% { transform: translateY(0px) rotate(0deg); opacity: 0.6; }
            75% { transform: translateY(12px) rotate(-6deg); opacity: 0.7; }
            100% { transform: translateY(0px) rotate(0deg); opacity: 0.6; }
        }

        .floating-element {
            animation: float 10s ease-in-out infinite;
            position: absolute;
            opacity: 0.6;
            filter: blur(4px);
        }

        .floating-element:nth-child(1) { top: 10%; left: 5%; animation-delay: 0s; width: 100px; height: 100px; }
        .floating-element:nth-child(2) { top: 30%; right: 10%; animation-delay: 2s; width: 80px; height: 80px; }
        .floating-element:nth-child(3) { bottom: 20%; left: 20%; animation-delay: 4s; width: 120px; height: 120px; }
        .floating-element:nth-child(4) { top: 50%; left: 40%; animation-delay: 6s; width: 70px; height: 70px; }
        .floating-element:nth-child(5) { bottom: 5%; right: 25%; animation-delay: 1s; width: 90px; height: 90px; }
        .floating-element:nth-child(6) { top: 15%; right: 30%; animation-delay: 3s; width: 110px; height: 110px; }

        /* Frosted glass effect for the content box - adjusted for new background */
        .frosted-glass {
            background-color: rgba(255, 255, 255, 0.5); /* Increased opacity for better contrast on lighter background */
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.7); /* More visible border for definition */
        }

        /* Custom pulse for text */
        @keyframes text-pulse {
            0%, 100% { transform: scale(1); opacity: 1; }
            50% { transform: scale(1.01); opacity: 0.95; }
        }
        .animate-text-pulse {
            animation: text-pulse 2.5s infinite ease-in-out;
        }
    </style>
</head>
<body class="flex items-center justify-center min-h-screen p-4 modern-gradient-bg relative">

    <!-- Animated background elements -->
    <div class="floating-element bg-white rounded-full"></div>
    <div class="floating-element bg-white rounded-lg transform rotate-45"></div>
    <div class="floating-element bg-white rounded-full"></div>
    <div class="floating-element bg-white rounded-lg transform rotate-45"></div>
    <div class="floating-element bg-white rounded-full"></div>
    <div class="floating-element bg-white rounded-lg transform rotate-45"></div>

    <div class="relative z-10 frosted-glass p-6 sm:p-8 md:p-12 rounded-2xl shadow-2xl max-w-2xl w-full text-center text-gray-800">
        <!-- Modern Maintenance Icon (SVG) - adjusted color for contrast -->
        <div class="mb-6">
            <svg class="mx-auto w-24 h-24 sm:w-32 sm:h-32 text-gray-700" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"></path>
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path>
            </svg>
        </div>

        <h1 class="text-4xl md:text-5xl font-extrabold mb-4 drop-shadow-lg text-gray-800">
            Undergoing Enhancements!
        </h1>

        <p class="text-lg md:text-xl text-gray-700 mb-6 font-normal">
            We're currently working hard to improve your experience.
            Our site will be back online shortly with exciting new features.
        </p>

        <p class="text-2xl md:text-3xl font-semibold text-gray-900 animate-text-pulse mb-8 drop-shadow-md">
            Stay Tuned!
        </p>

        <div class="text-gray-600 text-sm font-normal">
            <p>Thank you for your patience.</p>
            <p>We appreciate your understanding.</p>
        </div>

        <!-- Contact Information -->
        <div class="mt-8 pt-6 border-t border-gray-300 border-opacity-70">
            <p class="text-md text-gray-700 mb-2">Need to reach us?</p>
            <a href="mailto:support@evotar.xyz" class="text-blue-600 hover:text-blue-800 font-medium underline">support@evotar.xyz</a>
        </div>
    </div>
</body>
</html>
